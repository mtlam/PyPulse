[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
 
[project]
name = "PyPulse"
dynamic = ["version"]
description = "A python package for handling and analyzing PSRFITS files."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
authors = [
    { name = "Michael Lam", email = "michael.lam@nanograv.org" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.0",
    "matplotlib>=3.0",
    "astropy>=7.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
 
[project.urls]
Homepage = "https://github.com/mtlam/PyPulse"
Documentation = "https://mtlam.github.io/PyPulse/"
Issues = "https://github.com/mtlam/PyPulse/issues"
 
[tool.setuptools]
packages = ["pypulse"]
zip-safe = false
 
[tool.setuptools.package-data]
pypulse = ["config/*.cfg"]
 
[tool.setuptools.dynamic]
version = { attr = "pypulse.__version__" }
